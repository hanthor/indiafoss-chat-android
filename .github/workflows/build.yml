name: APK Build

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [ main, develop ]

# The repository is private, so jobs need contents read access for actions/checkout to work.
permissions:
  contents: read

# Allow all runs on main (one per commit). Just one per PR: a new push cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

# Enrich gradle.properties for CI/CD
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  # gradle.properties enables the configuration cache, build cache and parallel execution; the
  # upstream Element X `--no-configuration-cache` / `--no-daemon` flags are intentionally not set
  # here (setup-gradle stops the daemon at the end of the job).
  CI_GRADLE_ARG_PROPERTIES: --stacktrace
  # Used by Gradle (settings.gradle.kts) to resolve the Neutrino bindings from GitHub Packages
  # (element-hq/neutrino). The default github.token cannot read packages from other repositories,
  # so a PAT with read:packages scope is used instead.
  GITHUB_TOKEN: ${{ secrets.ELEMENT_BOT_TOKEN_NEUTRINO }}

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pull requests only build the debug APKs; the release bundle is compiled on pushes to
        # main, in the merge queue and on manual dispatch (a tag push would make zizmor flag the
        # Gradle cache as a cache-poisoning risk, so tags are not a trigger here).
        variant: ${{ fromJSON(github.event_name == 'pull_request' && '["debug"]' || '["debug", "release"]') }}
      fail-fast: false
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          # This might remove tools that are actually needed, if set to "true" but frees about 6 GB
          tool-cache: true
          # All of these default to true, but we should only need the 'android' one (and maybe swap-storage?)
          android: false
          dotnet: true
          haskell: true
          # This takes way too long to run (~2 minutes) and it saves only ~5.5GB
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Ensure we are building the branch and not the branch after being merged on main
          # https://github.com/actions/checkout/issues/881
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Test preview certificate validation
        run: python3 scripts/test_nightly_signing.py
      - name: Test release manifest tooling and check the Neutrino bindings provenance
        # Static half of the release-manifest dry run: the provenance record, version catalog and
        # build-script checksum must agree before Gradle downloads anything.
        run: |
          python3 scripts/test_release_manifest.py
          python3 scripts/release-manifest.py check-provenance
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          # The default branch is main: write the dependency/build cache there, read it everywhere else.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success
      - name: Assemble debug APKs
        if: ${{ matrix.variant == 'debug' }}
        run: ./gradlew :app:assembleGplayDebug app:assembleFDroidDebug -PallWarningsAsErrors=true $CI_GRADLE_ARG_PROPERTIES
      - name: Upload debug APKs
        if: ${{ matrix.variant == 'debug' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elementx-debug
          path: |
            app/build/outputs/apk/gplay/debug/*-universal-debug.apk
            app/build/outputs/apk/fdroid/debug/*-universal-debug.apk
      - name: Dry-run the release manifest on the debug-signed F-Droid universal APK
        # Exercises the publication path in PR CI without publication secrets: the manifest is
        # marked dryRun and the debug signer is recorded as found; nothing is released.
        if: ${{ matrix.variant == 'debug' }}
        run: |
          set -euo pipefail
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mapfile -t apks < <(find app/build/outputs/apk/fdroid/debug -name '*-universal-debug.apk')
          test "${#apks[@]}" -eq 1
          mapfile -t aars < <(find services/neutrino/impl/libs -maxdepth 1 -name 'neutrino-bindings-*.aar')
          test "${#aars[@]}" -eq 1
          python3 scripts/release-manifest.py build --dry-run \
            --apk "${apks[0]}" --output build/release-manifest-dry-run/release-manifest.json \
            --aar "${aars[0]}" --apksigner "$tools/apksigner" --flavour fdroid --build-type debug --abi universal
          python3 scripts/release-manifest.py verify --allow-dry-run \
            --apk "${apks[0]}" --manifest build/release-manifest-dry-run/release-manifest.json --apksigner "$tools/apksigner"
      - name: Upload dry-run release manifest
        if: ${{ matrix.variant == 'debug' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-dry-run
          path: build/release-manifest-dry-run/release-manifest.json
      - name: Compile release sources
        if: ${{ matrix.variant == 'release' }}
        run: ./gradlew bundleGplayRelease -PallWarningsAsErrors=true $CI_GRADLE_ARG_PROPERTIES
      - name: Verify the Neutrino bindings provenance against the downloaded .aar
        if: ${{ matrix.variant == 'release' }}
        run: |
          set -euo pipefail
          mapfile -t aars < <(find services/neutrino/impl/libs -maxdepth 1 -name 'neutrino-bindings-*.aar')
          test "${#aars[@]}" -eq 1
          python3 scripts/release-manifest.py check-provenance --aar "${aars[0]}"
