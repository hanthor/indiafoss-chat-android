version: 2
updates:
  - package-ecosystem: 'gradle'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    reviewers:
      - 'hanthor'
    labels:
      - 'dependencies'
      - 'security'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'ci'
